name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # job 定義は scripts/ci/routes/ が正本。ここは実行の器だけ。
  PYTHON_VERSION: "3.12"

jobs:
  # 変更 path から実行すべき route を決める。routing の判定は
  # scripts/ci/plan.py -> scripts/ci/paths.py。
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Select routes
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          # main は全 route・全 OS。それ以外（develop など）は変更 path から選び、
          # Linux 実装がある route は Linux に寄せる（Windows 専用 route は残る）。
          if [ "${BASE_REF}" = "main" ]; then
            scope=(--full)
          else
            scope=(--prefer-os linux)
          fi
          # base が解決できない場合 plan.py が全 route を選び、理由を stderr に出す。
          python -m scripts.ci.plan --github-outputs --reason \
            --base "${BASE_SHA:-invalid}" "${scope[@]}" >> "$GITHUB_OUTPUT"
          echo "### Selected routes" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$(python -m scripts.ci.plan --selected --base "${BASE_SHA:-invalid}" "${scope[@]}")"'`' >> "$GITHUB_STEP_SUMMARY"

  # 実際の検証。step 列は scripts/ci/routes/ が持ち、ここは matrix を
  # 展開して run.py に委譲するだけ。
  ci:
    name: ${{ matrix.route.name }}
    needs: plan
    # plan が失敗した場合に空の matrix で落ちないよう、成功と選択の両方を要求する。
    if: success() && needs.plan.outputs.count != '0' && needs.plan.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix:
        route: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.route.runner }}
    timeout-minutes: ${{ matrix.route.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.route.checkout_depth }}

      # run.py 自体が Python なので、route の python 設定に関わらず必ず入れる。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.route.python || '3.12' }}

      - uses: actions/setup-node@v4
        if: matrix.route.node
        with:
          node-version: ${{ matrix.route.node }}
          cache: ${{ matrix.route.node_cache }}
          cache-dependency-path: ${{ matrix.route.node_cache_path }}

      - uses: dtolnay/rust-toolchain@master
        if: matrix.route.rust
        with:
          toolchain: ${{ matrix.route.toolchain }}
          components: ${{ matrix.route.rust_components }}
          targets: ${{ matrix.route.rust_targets }}

      - uses: taiki-e/install-action@v2
        if: matrix.route.wasm_bindgen
        with:
          tool: wasm-bindgen@${{ matrix.route.wasm_bindgen }}

      - uses: actions/setup-java@v4
        if: matrix.route.java
        with:
          distribution: temurin
          java-version: ${{ matrix.route.java }}

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.route.gradle

      # rust-cache は OS ごとに共有し、古い成果物を剪定して 10GB 枠を
      # 圧迫しない。target 配下（--target-dir で分けたものも含む）は
      # すべて target/ の内側なので、これだけで足りる。
      - uses: Swatinem/rust-cache@v2
        if: matrix.route.cache
        with:
          shared-key: rust-${{ matrix.route.os }}
          # PR では保存しない。develop / main のキャッシュを全 PR が読む。
          save-if: ${{ github.event_name != 'pull_request' }}

      # 復元された中身を次回以降の判断材料にする（L2 の計測）。
      # Windows runner の既定は PowerShell で du / find が無いため bash を使う。
      - name: Report restored cache
        if: matrix.route.cache
        shell: bash
        run: |
          echo "### ${{ matrix.route.name }} cache" >> "$GITHUB_STEP_SUMMARY"
          echo "- target: $(du -sh target 2>/dev/null | cut -f1 || echo none)" >> "$GITHUB_STEP_SUMMARY"
          echo "- rlib: $(find target -name '*.rlib' 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run ${{ matrix.route.name }}
        working-directory: ${{ github.workspace }}
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python -m scripts.ci.run ${{ matrix.route.job }} --no-prerequisite-check --os ${{ matrix.route.os }}

  gate:
    name: Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check results
        env:
          SELECTED_ROUTES: ${{ needs.plan.outputs.selected }}
          SELECTED_COUNT: ${{ needs.plan.outputs.count }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci.gate
