[package]
name = "extension-runtime"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[features]
default = ["worker"]
worker = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:libloading", "dep:extension-native-api", "dep:tempfile"]

[[bin]]
name = "lapis-extension-host"
path = "src/bin/lapis-extension-host.rs"
required-features = ["worker"]

[dependencies]
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
process = { path = "../../../protocol/types/process" }
extension-native-api = { path = "../../../protocol/extension-api/native", optional = true }
libloading = { version = "0.8.9", optional = true }
tempfile = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

[dev-dependencies]
wat = "1"
