[package]
name = "lapis-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bridge-smoke = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
futures-util = "0.3"
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
lapis-client-api = { path = "../../../shared/protocol" }
lapis-client-core = { path = "../../../shared/client" }
lapis-desktop-client = { path = "../../desktop/client" }
lapis-desktop-ui = { path = "../../desktop/ui" }
lapis-document = { path = "../../../shared/models/document" }
lapis-editor-core = { path = "../../../shared/models/editor-core" }
lapis-git = { path = "../../../shared/models/git" }
lapis-lsp = { path = "../../../shared/models/lsp" }
lapis-settings = { path = "../../../shared/models/settings" }
lapis-task = { path = "../../../shared/models/task" }
lapis-terminal = { path = "../../../shared/models/terminal" }
lapis-wire = { path = "../../../shared/models/wire" }
lapis-workspace = { path = "../../../shared/models/workspace" }
lapis-workbench = { path = "../../../shared/models/workbench" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["WebSocket", "MessageEvent", "Event", "ErrorEvent"] }
zeroize.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.gpui_preview]
package = "gpui-pre"
version = "=0.3.9"
default-features = false
