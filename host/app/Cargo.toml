[package]
name = "host"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "lapis-host"
path = "src/main.rs"

[dependencies]
workspace = { path = "../../contracts/domain/workspace" }
workbench = { path = "../../contracts/domain/workbench" }
document = { path = "../../contracts/domain/document" }
git = { package = "git-contract", path = "../../extensions/git/contract" }
futures-channel = "0.3"
task = { path = "../../contracts/domain/task" }
process = { path = "../../contracts/domain/process" }
editor-core = { path = "../../contracts/domain/editor-core" }
backend-state = { path = "../runtime" }
extensions-entry = { path = "../extensions-entry" }
extension-ui-contract = { path = "../../contracts/domain/extension-ui" }
extension-runtime = { path = "../adapters/extension-runtime", default-features = false }
semver = "1"
client-api = { path = "../../contracts/protocol" }
platform = { path = "../adapters/local" }
local-process = { path = "../adapters/process" }
local-terminal = { path = "../../extensions/terminal/adapter" }
terminal = { package = "terminal-contract", path = "../../extensions/terminal/contract" }
remote = { path = "../transport/remote" }
wire = { path = "../../contracts/transport/wire" }
tokio = { workspace = true, features = ["signal"] }
rustls.workspace = true
rcgen.workspace = true
zeroize.workspace = true
getrandom.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "3"
futures-util.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# 拡張 package の読み込み経路を確かめるテストが zip を組み立てる。
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
winresource.workspace = true
