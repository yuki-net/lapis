name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # job 定義は scripts/ci/jobs.py が唯一の正本。ここは実行の器だけ。
  PYTHON_VERSION: "3.12"

jobs:
  # 変更 path から実行すべき route を決める。routing の判定は
  # scripts/ci/plan.py -> scripts/ci/paths.py。
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Select routes
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # base が解決できない場合 plan.py が全 route を選び、理由を stderr に出す。
          python -m scripts.ci.plan --github-outputs --reason \
            --base "${BASE_SHA:-invalid}" >> "$GITHUB_OUTPUT"
          echo "### Selected routes" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$(python -m scripts.ci.plan --selected --base "${BASE_SHA:-invalid}")"'`' >> "$GITHUB_STEP_SUMMARY"

  # 実際の検証。step 列は scripts/ci/jobs.py を持ち、ここは matrix を
  # 展開して run.py に委譲するだけ。
  ci:
    name: ${{ matrix.route.name }}
    needs: plan
    # plan が失敗した場合に空の matrix で落ちないよう、成功と選択の両方を要求する。
    if: success() && needs.plan.outputs.count != '0' && needs.plan.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix:
        route: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.route.runs_on }}
    timeout-minutes: ${{ matrix.route.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.route.checkout_depth }}

      # run.py 自体が Python なので、route の python 設定に関わらず必ず入れる。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.route.python || '3.12' }}

      - uses: actions/setup-node@v4
        if: matrix.route.node
        with:
          node-version: ${{ matrix.route.node }}
          cache: ${{ matrix.route.node_cache }}
          cache-dependency-path: ${{ matrix.route.node_cache_path }}

      - uses: dtolnay/rust-toolchain@master
        if: matrix.route.rust
        with:
          toolchain: ${{ matrix.route.toolchain }}
          components: ${{ matrix.route.rust_components }}
          targets: ${{ matrix.route.rust_targets }}

      - uses: taiki-e/install-action@v2
        if: matrix.route.wasm_bindgen
        with:
          tool: wasm-bindgen@${{ matrix.route.wasm_bindgen }}

      - uses: actions/setup-java@v4
        if: matrix.route.java
        with:
          distribution: temurin
          java-version: ${{ matrix.route.java }}

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.route.gradle

      - uses: actions/cache@v4
        if: matrix.route.cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ matrix.route.cache }}-${{ runner.os }}-rust-${{ matrix.route.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.route.cache }}-${{ runner.os }}-rust-${{ matrix.route.toolchain }}-

      - name: Run ${{ matrix.route.name }}
        working-directory: ${{ github.workspace }}
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python -m scripts.ci.run ${{ matrix.route.job }} --no-prerequisite-check --os ${{ matrix.route.os }}

  gate:
    name: Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check results
        env:
          SELECTED_ROUTES: ${{ needs.plan.outputs.selected }}
          SELECTED_COUNT: ${{ needs.plan.outputs.count }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci.gate
