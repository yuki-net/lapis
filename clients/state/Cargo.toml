[package]
name = "desktop-client"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
client-api = { path = "../../contracts/protocol" }
document = { path = "../../contracts/domain/document" }
editor-core = { path = "../../contracts/domain/editor-core" }
git = { path = "../../contracts/domain/git" }
lsp = { path = "../../contracts/domain/lsp" }
project = { path = "../../contracts/domain/project" }
localization = { path = "../../contracts/domain/localization" }
settings = { path = "../../contracts/domain/settings" }
task = { path = "../../contracts/domain/task" }
terminal = { path = "../../contracts/domain/terminal" }
workspace = { path = "../../contracts/domain/workspace" }
workbench = { path = "../../contracts/domain/workbench" }
serde.workspace = true
getrandom.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
client-core = { path = "../transport" }
futures-channel = "0.3"
futures-util = "0.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["console"] }
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
