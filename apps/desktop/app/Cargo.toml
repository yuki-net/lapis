[package]
name = "lapis"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[features]
hot-reload = ["desktop-ui/hot-reload"]

[dependencies]
host = { path = "../../../host/app" }
client-api = { path = "../../../protocol/wire/client-api" }
zeroize.workspace = true
desktop-client = { path = "../../../workbench/state" }
desktop-ui = { path = "../../../workbench/ui" }
terminal = { package = "terminal-contract", path = "../../../extensions/terminal/contract" }
futures-channel = "0.3"
lapis-launcher = { path = "../../launcher" }
platform = { path = "../../../host/adapters/local" }
local-process = { path = "../../../host/adapters/process" }
process = { path = "../../../protocol/types/process" }
persistence = { path = "../persistence" }
remote = { path = "../../../host/transport/remote" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
settings = { path = "../../../protocol/types/settings" }
task = { path = "../../../protocol/types/task" }
tempfile.workspace = true
getrandom.workspace = true
rfd.workspace = true
sysinfo.workspace = true
wire = { path = "../../../protocol/wire/dto" }

[dev-dependencies]
editor-core = { path = "../../../protocol/types/editor-core" }
workbench = { path = "../../../protocol/types/workbench" }
workspace = { path = "../../../protocol/types/workspace" }
tempfile.workspace = true

[build-dependencies]
winresource.workspace = true
