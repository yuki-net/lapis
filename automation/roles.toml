# 自動化のロール定義。3 人目以降はここに 1 ブロック足す。
# 鍵の実体はブローカーが解決する。roles.toml にファイルパスを書かない。
# coordinator（オーナー側 Orca bot）はここに含めない。監視と質問対応だけを行い、
# 実装・レビュー・merge はしない。

version = 1

[roles.worker]
agent = "opencode"
fallback_agent = "junie"
merge = false
key_ref = "worker"
# App 作成後に埋める。空のままでは dispatch しない。
app_id = ""
installation_id = ""
bot_login = "lapis-worker[bot]"

[roles.reviewer]
agent = "opencode"
fallback_agent = "junie"
# reviewer は read-only。merge しない。
merge = false
key_ref = "reviewer"
app_id = ""
installation_id = ""
bot_login = "lapis-reviewer[bot]"

# 3 人目（例: 可否判断だけを行う judge）。
# App を作り、read-only（Contents: R / Pull requests: R）で足す。
# [roles.judge]
# agent = "opencode"
# fallback_agent = "junie"
# merge = false
# key_ref = "judge"
# app_id = ""
# installation_id = ""
# bot_login = "lapis-judge[bot]"
