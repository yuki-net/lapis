persistence = { path = "../persistence" }
remote = { path = "../../../host/transport/remote" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
settings = { path = "../../../contracts/domain/settings" }
task = { path = "../../../contracts/domain/task" }
tempfile.workspace = true
getrandom.workspace = true
rfd.workspace = true

[dev-dependencies]
editor-core = { path = "../../../contracts/domain/editor-core" }
