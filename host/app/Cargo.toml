[package]
name = "host"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "lapis-host"
path = "src/main.rs"

[dependencies]
workspace = { path = "../../contracts/domain/workspace" }
workbench = { path = "../../contracts/domain/workbench" }
document = { path = "../../contracts/domain/document" }
git = { package = "git-contract", path = "../../extensions/git/contract" }
futures-channel = "0.3"
task = { path = "../../contracts/domain/task" }
editor-core = { path = "../../contracts/domain/editor-core" }
backend-state = { path = "../runtime" }
client-api = { path = "../../contracts/protocol" }
platform = { path = "../adapters/local" }
terminal = { path = "../../contracts/domain/terminal" }
remote = { path = "../transport/remote" }
wire = { path = "../../contracts/transport/wire" }
tokio = { workspace = true, features = ["signal"] }
rustls.workspace = true
rcgen.workspace = true
zeroize.workspace = true
getrandom.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[build-dependencies]
winresource.workspace = true
