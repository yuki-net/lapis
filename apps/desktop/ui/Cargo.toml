[package]
name = "lapis-desktop-ui"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
getrandom.workspace = true
serde.workspace = true
lapis-desktop-client = { path = "../client" }
lapis-document = { path = "../../../shared/models/document" }
lapis-editor-core = { path = "../../../shared/models/editor-core" }
lapis-git = { path = "../../../shared/models/git" }
lapis-language = { path = "../../../shared/models/language" }
lapis-localization = { path = "../../../shared/models/localization" }
lapis-lsp = { path = "../../../shared/models/lsp" }
lapis-settings = { path = "../../../shared/models/settings" }
lapis-task = { path = "../../../shared/models/task" }
lapis-terminal = { path = "../../../shared/models/terminal" }
lapis-workspace = { path = "../../../shared/models/workspace" }
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
