[package]
name = "lapis-desktop-client"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
lapis-client-api = { path = "../../contracts/protocol" }
lapis-document = { path = "../../contracts/domain/document" }
lapis-editor-core = { path = "../../contracts/domain/editor-core" }
lapis-git = { path = "../../contracts/domain/git" }
lapis-lsp = { path = "../../contracts/domain/lsp" }
lapis-project = { path = "../../contracts/domain/project" }
lapis-localization = { path = "../../contracts/domain/localization" }
lapis-settings = { path = "../../contracts/domain/settings" }
lapis-task = { path = "../../contracts/domain/task" }
lapis-terminal = { path = "../../contracts/domain/terminal" }
lapis-workspace = { path = "../../contracts/domain/workspace" }
lapis-workbench = { path = "../../contracts/domain/workbench" }
serde.workspace = true
getrandom.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
lapis-client-core = { path = "../transport" }
futures-channel = "0.3"
futures-util = "0.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["console"] }
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
