[package]
name = "desktop-client"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
acp-contract = { path = "../../extensions/acp/contract" }
client-api = { path = "../../protocol/wire/client-api" }
extension-ui-contract = { path = "../../protocol/types/extension-ui" }
document = { path = "../../protocol/types/document" }
editor-core = { path = "../../protocol/types/editor-core" }
git = { package = "git-contract", path = "../../extensions/git/contract" }
project = { path = "../../protocol/types/project" }
process = { path = "../../protocol/types/process" }
localization = { path = "../../protocol/types/localization" }
settings = { path = "../../protocol/types/settings" }
task = { path = "../../protocol/types/task" }
terminal = { package = "terminal-contract", path = "../../extensions/terminal/contract" }
terminal-session-api = { path = "../../extensions/terminal/api" }
terminal-portable-renderer = { path = "../../extensions/terminal/portable-renderer" }
workspace = { path = "../../protocol/types/workspace" }
workbench = { path = "../../protocol/types/workbench" }
wire = { path = "../../protocol/wire/dto" }
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
zeroize.workspace = true
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
terminal-renderer = { path = "../../extensions/terminal/renderer" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
client-core = { path = "../../protocol/wire-client" }
futures-util = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["console"] }

[dev-dependencies]
futures-channel = "0.3"
tempfile.workspace = true
