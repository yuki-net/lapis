[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bridge-smoke = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
futures-util = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
client-api = { path = "../../../contracts/protocol" }
client-core = { path = "../../transport" }
editor-core = { path = "../../../contracts/domain/editor-core" }
wire = { path = "../../../contracts/transport/wire" }
workbench = { path = "../../../contracts/domain/workbench" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["WebSocket", "MessageEvent", "Event", "ErrorEvent"] }
zeroize.workspace = true
