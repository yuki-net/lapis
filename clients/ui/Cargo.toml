[package]
name = "lapis-desktop-ui"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
hot-reload = ["dep:async-channel", "dep:dioxus-devtools", "dep:subsecond", "gpui/hot-reload"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom.workspace = true
web-time = "1.1"
serde.workspace = true
lapis-desktop-client = { path = "../state" }
lapis-document = { path = "../../contracts/domain/document" }
lapis-editor-core = { path = "../../contracts/domain/editor-core" }
lapis-git = { path = "../../contracts/domain/git" }
lapis-language = { path = "../../contracts/domain/language" }
lapis-localization = { path = "../../contracts/domain/localization" }
lapis-lsp = { path = "../../contracts/domain/lsp" }
lapis-settings = { path = "../../contracts/domain/settings" }
lapis-task = { path = "../../contracts/domain/task" }
lapis-terminal = { path = "../../contracts/domain/terminal" }
lapis-workspace = { path = "../../contracts/domain/workspace" }
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
async-channel = { version = "2", optional = true }
dioxus-devtools = { version = "=0.7.10", optional = true }
subsecond = { version = "=0.7.10", optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_preview = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false }
gpui_web = { package = "gpui-pre-web", version = "=0.3.9", default-features = false }
getrandom = { workspace = true, features = ["wasm_js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Location", "Window"] }
console_error_panic_hook = "0.1"
lapis-client-api = { path = "../../contracts/protocol" }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
