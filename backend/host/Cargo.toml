[package]
name = "lapis-host"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
lapis-workspace = { path = "../../shared/models/workspace" }
lapis-document = { path = "../../shared/models/document" }
lapis-git = { path = "../../shared/models/git" }
lapis-task = { path = "../../shared/models/task" }
lapis-editor-core = { path = "../../shared/models/editor-core" }
lapis-backend-state = { path = "../runtime" }
lapis-client-api = { path = "../../shared/protocol" }
lapis-platform = { path = "../infrastructure/local" }
lapis-terminal = { path = "../../shared/models/terminal" }
lapis-remote = { path = "../transport/remote" }
tokio = { workspace = true, features = ["signal"] }
rustls.workspace = true
rcgen.workspace = true
zeroize.workspace = true
getrandom.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
