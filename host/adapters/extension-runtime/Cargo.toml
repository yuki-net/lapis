[package]
name = "extension-runtime"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[features]
default = ["worker"]
worker = ["dep:wasmtime", "dep:wasmtime-wasi"]

[[bin]]
name = "lapis-extension-host"
path = "src/bin/lapis-extension-host.rs"
required-features = ["worker"]

[dependencies]
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
process = { path = "../../../contracts/domain/process" }
wasmtime = { version = "40.0.0", optional = true, default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "40.0.0", optional = true, default-features = false, features = ["p2"] }

[dev-dependencies]
wat = "1"
