# 共通レビュー規約は docs/workflow.md を正本とする。
# AGENTS.md は構造の憲法に限定し、ここではレビュー動作と領域固有の重点観点だけを設定する。
language: ja-JP

reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
  pre_merge_checks:
    docstrings:
      # Rust の /// を検出できず常に 0% と判定されるため無効にする。
      # docstring の網羅は本リポジトリの規約ではない。
      mode: "off"
  path_instructions:
    # AGENTS.md は構造の憲法に限定したため、レビュー基準はここでも明示する。
    - path: "**"
      instructions: |
        共通のレビュー規約は docs/workflow.md を正本とする。
        変更関連のテスト・CI が通ること、不具合修正の回帰テスト、
        UI 変更の実機確認を確認する。
        レビューでは不具合、データ損失、セキュリティ、並行性、リーク、
        テスト不足を最優先する。
    - path: "host/transport/remote/**"
      instructions: |
        TLS 1.3、ペアリングの期限と一回性、認証情報の失効、
        認可の抜け、競合状態を重点的に確認する。
        セキュリティ上の保証は実装とテストに照らして判定し、
        未実装のクライアント側設計と混同しない。
    - path: "apps/desktop/**"
      instructions: |
        GPUI の描画スレッドでのブロッキング、描画中の外部 I/O、
        非同期結果による古い状態の反映、
        状態とライフサイクルの所有境界を重点的に確認する。
    - path: "clients/state/**"
      instructions: |
        GPUI の描画スレッドでのブロッキング、描画中の外部 I/O、
        非同期結果による古い状態の反映、
        状態とライフサイクルの所有境界を重点的に確認する。
    - path: "clients/ui/**"
      instructions: |
        GPUI の描画スレッドでのブロッキング、描画中の外部 I/O、
        非同期結果による古い状態の反映、
        状態とライフサイクルの所有境界を重点的に確認する。
    - path: "docs/**"
      instructions: |
        実装済みと未実装の混同、リンク切れ、
        仕様の正本の重複、維持すべき設計根拠の脱落を確認する。
