[package]
name = "lapis"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[features]
hot-reload = ["desktop-ui/hot-reload"]

[dependencies]
host = { path = "../../../host/app" }
client-api = { path = "../../../contracts/protocol" }
zeroize.workspace = true
desktop-client = { path = "../../state" }
desktop-ui = { path = "../../ui" }
terminal = { package = "terminal-contract", path = "../../../extensions/terminal/contract" }
futures-channel = "0.3"
lapis-launcher = { path = "../launcher" }
platform = { path = "../../../host/adapters/local" }
local-process = { path = "../../../host/adapters/process" }
process = { path = "../../../contracts/domain/process" }
persistence = { path = "../persistence" }
remote = { path = "../../../host/transport/remote" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
settings = { path = "../../../contracts/domain/settings" }
task = { path = "../../../contracts/domain/task" }
tempfile.workspace = true
getrandom.workspace = true
rfd.workspace = true
sysinfo.workspace = true
wire = { path = "../../../contracts/transport/wire" }

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "3"
serde_json.workspace = true
editor-core = { path = "../../../contracts/domain/editor-core" }
workbench = { path = "../../../contracts/domain/workbench" }
workspace = { path = "../../../contracts/domain/workspace" }
tempfile.workspace = true

[target.'cfg(not(windows))'.dev-dependencies]
local-terminal = { path = "../../../extensions/terminal/adapter" }

[build-dependencies]
winresource.workspace = true
