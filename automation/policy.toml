# レビュー・マージ・リトライ・保護パスの正本。
# 実装（dispatch / reviewer / coordinator）はこの値を読む。値をコードに散らさない。
# 同一アカウント運用。merge 禁止 / read-only は GitHub の強制ではなく手順の制約。

version = 1

[merge]
# verifier PASS のとき、coordinator が owner 名義で merge する。
actor = "coordinator"
require_verdict = "pass"
require_ci = "Gate"
deny_protected_paths = true
deny_workflow_changes = true
deny_forks = true

[review]
# 同じ PR で 3 回 FAIL したら停止してオーナーへ。
max_fail = 3
# 変更行数とファイル数の大きい方の区分を使う。
# 上から順に評価し、最後の large が残りを受ける。
[[review.tiers]]
name = "small"
lines_below = 50
files_at_most = 2
roles = ["verifier", "skeptic"]

[[review.tiers]]
name = "medium"
lines_below = 200
files_at_most = 4
roles = ["verifier", "skeptic", "architect"]

[[review.tiers]]
name = "large"
roles = ["verifier", "skeptic", "architect", "minimalist"]

[limits]
# ai-building のまま残ったジョブを回収するまでの分数。
stale_building_minutes = 60
# 1 ジョブ（worker / review）の上限。
job_timeout_minutes = 60

[protected_paths]
# ここを 1 つでも触った PR は、人間が承認するまで merge しない。
# CODEOWNERS の保護範囲に合わせる。
paths = [
  ".github/",
  "automation/",
  "reviewer/",
  "lints/",
  "scripts/ci/",
  "scripts/check*.py",
  "scripts/architecture-exceptions.json",
  "AGENTS.md",
  "Cargo.toml",
  "Cargo.lock",
  "protocol/",
  "release/",
  "clippy.toml",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "docs/specs/automation.md",
  ".opencode/skills/build-issue/",
  ".opencode/skills/review-pr/",
]
