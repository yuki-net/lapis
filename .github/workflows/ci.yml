name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.96.0

jobs:
  # 変更pathから実行すべきjobを判定
  path_filter:
    name: Path Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List jobs
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          jobs=$(python scripts/ci/paths.py list "${BASE_SHA:-invalid}")
          echo "jobs=$jobs" >> $GITHUB_OUTPUT
    outputs:
      jobs: ${{ steps.paths.outputs.jobs }}

  dev_windows:
    name: Development commands / Windows
    runs-on: windows-2022
    needs: path_filter
    if: contains(fromJSON(needs.path_filter.outputs.jobs), 'dev_windows')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p test_dev_commands.py

  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: path_filter
    if: >-
      needs.path_filter.outputs.jobs != '[]' &&
      contains(needs.path_filter.outputs.jobs, 'repository')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository checks
        run: python scripts/check.py repository architecture

  rust_core:
    name: Rust Core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: path_filter
    if: >-
      needs.path_filter.outputs.jobs != '[]' &&
      contains(needs.path_filter.outputs.jobs, 'rust_core')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: rust-core-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-core-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Check architecture
        run: python3 scripts/check.py rust_core architecture

      - name: Check formatting
        run: python3 scripts/check.py rust_core format

      - name: Test Rust Core
        run: python3 scripts/check.py rust_core test

      - name: Lint Rust Core
        run: python3 scripts/check.py rust_core lint

  host_windows:
    name: Host / Windows
    runs-on: windows-2022
    timeout-minutes: 50
    needs: path_filter
    if: >-
      needs.path_filter.outputs.jobs != '[]' &&
      contains(needs.path_filter.outputs.jobs, 'host')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: host-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            host-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Check architecture
        run: python scripts/check.py host architecture

      - name: Check formatting
        run: python scripts/check.py host format

      - name: Test Host
        run: python scripts/check.py host test

      - name: Lint Host
        run: python scripts/check.py host lint

      - name: Build Host
        run: python scripts/check.py host build

  desktop_windows:
    name: Desktop / Windows
    runs-on: windows-2022
    timeout-minutes: 60
    needs: path_filter
    if: >-
      needs.path_filter.outputs.jobs != '[]' &&
      contains(needs.path_filter.outputs.jobs, 'desktop')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: desktop-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            desktop-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Check architecture
        run: python scripts/check.py desktop architecture

      - name: Check formatting
        run: python scripts/check.py desktop format

      - name: Test Desktop
        run: python scripts/check.py desktop test

      - name: Lint Desktop
        run: python scripts/check.py desktop lint

      - name: Build Desktop
        run: python scripts/check.py desktop build

      - name: Verify GPUI patches
        shell: pwsh
        run: |
          foreach ($patch in @('external-inspector', 'windows', 'drag')) {
            git apply --unidiff-zero --ignore-space-change --check --reverse --directory=vendor/gpui "patches/gpui-0.2.2-$patch.patch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Release Desktop
        run: cargo build -p lapis -p lapis-host --release --locked

      - name: Test Release Inspector boundary
        run: cargo test -p lapis-desktop-ui --release release_build_does_not_register_inspector_command --locked

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: path_filter
    if: >-
      needs.path_filter.outputs.jobs != '[]' &&
      contains(needs.path_filter.outputs.jobs, 'mobile')
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test shared KMP code
        run: ./gradlew :sharedUi:testDebugUnitTest --stacktrace

      - name: Build Android app
        run: ./gradlew :androidApp:assembleDebug --stacktrace

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: path_filter
    if: >-
      needs.path_filter.outputs.jobs != '[]' &&
      contains(needs.path_filter.outputs.jobs, 'web')

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

  ci_gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - path_filter
      - repository
      - rust_core
      - host_windows
      - desktop_windows
      - dev_windows
      - mobile
      - web
    steps:
      - uses: actions/checkout@v4
      - name: Check results
        env:
          SELECTED_JOBS: ${{ needs.path_filter.outputs.jobs }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci.gate
