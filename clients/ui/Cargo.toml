[package]
name = "desktop-ui"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
hot-reload = ["dep:async-channel", "dep:dioxus-devtools", "dep:subsecond", "gpui/hot-reload"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util.workspace = true
getrandom.workspace = true
web-time = "1.1"
serde.workspace = true
zeroize.workspace = true
desktop-client = { path = "../state" }
document = { path = "../../contracts/domain/document" }
editor-core = { path = "../../contracts/domain/editor-core" }
git = { package = "git-contract", path = "../../extensions/git/contract" }
language = { path = "../../contracts/domain/language" }
localization = { path = "../../contracts/domain/localization" }
process = { path = "../../contracts/domain/process" }
lsp = { path = "../../contracts/domain/lsp" }
settings = { path = "../../contracts/domain/settings" }
task = { path = "../../contracts/domain/task" }
terminal = { package = "terminal-contract", path = "../../extensions/terminal/contract" }
workspace = { path = "../../contracts/domain/workspace" }
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
async-channel = { version = "2", optional = true }
dioxus-devtools = { version = "=0.7.10", optional = true }
subsecond = { version = "=0.7.10", optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# 同梱フォントの family 名・グリフ被覆・等幅性を検証する。
ttf-parser = "0.25"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_preview = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false }
gpui_web = { package = "gpui-pre-web", version = "=0.3.9", default-features = false }
getrandom = { workspace = true, features = ["wasm_js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
    "CustomEvent",
    "CustomEventInit",
    "EventTarget",
    "Location",
    "Window",
] }
console_error_panic_hook = "0.1"
client-api = { path = "../../contracts/protocol" }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
