# 自動化のロール定義。3 人目以降はここに 1 ブロック足す。
# コミット・PR・merge は owner 名義。GitHub App / orcaworker / ブローカーは使わない。
# write / merge の制約は GitHub の権限ではなく、手順とプロンプトの制約。

version = 1

[roles.coordinator]
agent = "orca"
auth = "owner"
write = true
# verifier PASS のときだけ merge する。保護パス / workflows は対象外。
merge = true

[roles.worker]
agent = "opencode"
fallback_agent = "junie"
auth = "owner"
write = true
merge = false

[roles.verifier]
agent = "opencode"
auth = "owner"
write = false
merge = false
verdict = "pass-fail"

[roles.skeptic]
agent = "opencode"
auth = "owner"
write = false
merge = false

[roles.architect]
agent = "opencode"
auth = "owner"
write = false
merge = false

[roles.minimalist]
agent = "opencode"
auth = "owner"
write = false
merge = false
