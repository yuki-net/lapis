[package]
name = "workbench-shell"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
desktop-client = { path = "../state" }
editor-core = { path = "../../protocol/types/editor-core" }
extension-ui-contract = { path = "../../protocol/types/extension-ui" }
getrandom.workspace = true
language = { path = "../../protocol/types/language" }
localization = { path = "../../protocol/types/localization" }
tracing.workspace = true
workspace = { path = "../../protocol/types/workspace" }
ui-kit = { path = "../ui-kit" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_preview = { package = "gpui-pre", version = "=0.3.9", default-features = false }
getrandom = { workspace = true, features = ["wasm_js"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[dev-dependencies]
document = { path = "../../protocol/types/document" }
gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
settings = { path = "../../protocol/types/settings" }
