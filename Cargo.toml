[workspace]
members = [
    "apps/desktop/*",
    "backend/core/*",
    "backend/local",
    "backend/persistence",
    "features/*",
]
exclude = ["vendor/gpui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A small Markdown editor built with GPUI."
license = "MIT"

[workspace.dependencies]
gpui = { version = "0.2.2", path = "vendor/gpui" }
rfd = "0.15"
ropey = "1.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
portable-pty = "0.9"
