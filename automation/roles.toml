# 自動化のロール定義。3 人目以降はここに 1 ブロック足す。
# worker / reviewer は Windows の別ユーザー `orcaworker` で動く。
# 鍵の実体はブローカーが解決する。roles.toml に実パスを書かない。
# coordinator（オーナー側 Orca bot）はここに含めない。監視と進行だけを行い、
# merge・approve・保護パス変更・コード編集はしない。

version = 1

[roles.worker]
agent = "opencode"
fallback_agent = "junie"
merge = false
# App 作成後に埋める。空のままでは dispatch しない。
app_id = ""
installation_id = ""
private_key = ""
bot_login = "lapis-worker[bot]"

[roles.reviewer]
agent = "opencode"
fallback_agent = "junie"
# reviewer は read-only。merge しない。
merge = false
app_id = ""
installation_id = ""
private_key = ""
bot_login = "lapis-reviewer[bot]"

# 3 人目（例: 可否判断だけを行う judge）。
# App を作り、read-only（Contents: R / Pull requests: R / Checks: R / Commit statuses: R）で足す。
# [roles.judge]
# agent = "opencode"
# fallback_agent = "junie"
# merge = false
# app_id = ""
# installation_id = ""
# private_key = ""
# bot_login = "lapis-judge[bot]"
