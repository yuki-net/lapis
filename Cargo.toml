[workspace]
members = [
    "apps/desktop/*",
    "apps/launcher",
    "workbench/*",
    "protocol/wire-client",
    "apps/web/wasm",
    "host/runtime",
    "host/domains/*",
    "host/app",
    "host/adapters/*",
    "host/extensions-entry",
    "host/transport/*",
    "protocol/types/*",
    "protocol/wire/*",
    "protocol/extension-api/native",
    # Dependabot は `members` の glob を末尾1階層しか展開できない。`extensions/*/*` の
    # ように階層の途中に `*` を置くとメンバーが解決されず、Dependabot が生成する
    # Cargo.lock から workspace メンバーが脱落する（`--locked` が失敗する）。
    # 拡張グループごとに列挙し、新しいグループを追加したときはここに足す。
    "extensions/acp/*",
    "extensions/git/*",
    "extensions/terminal/*",
]
exclude = ["vendor/gpui", "vendor/portable-pty", "extensions/terminal/component"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A lightweight development workspace for Desktop and Mobile."
license = "MIT"

# Keep debug symbols and assertions for the dev run configuration while
# avoiding the frame-time cost of a completely unoptimized GPUI application.
[profile.dev]
opt-level = 1

# Hot Patch の workspace replay では Thin LTO の再実行を避ける。
[profile.hot-reload]
inherits = "dev"
lto = "off"

[profile.web]
inherits = "dev"
debug = 0

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
gpui = { version = "0.2.2", path = "vendor/gpui" }
rfd = "0.15"
ropey = "1.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = "0.23"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
# wasmtime と wasmtime-wasi は同じ major で同時に更新する必要がある。
# lock はルートにしかないため、バージョン宣言もここに置く（Dependabot の security update が
# lockfile のないサブディレクトリを対象にして失敗するのを避ける）。
wasmtime = { version = "48.0.7", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "48.0.7", default-features = false, features = ["p2"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
futures = "0.3"
getrandom = "0.3"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
portable-pty = { path = "vendor/portable-pty" }
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb" }
wezterm-surface = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb" }
rcgen = "0.14"
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
winresource = "0.1"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
notify = "8.2"
sysinfo = "0.31.4"

# `web_sys_unstable_apis` を有効にすると web-sys の `getImageData` が IDL に忠実な
# `i32` 版へ切り替わる。gpui-pre-web は `f64` 版前提のため、差分をこのローカル版で吸収する。
[patch.crates-io]
gpui-pre-web = { path = "vendor/gpui-pre-web" }
