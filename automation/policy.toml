# レビュー・リトライ・保護パスの正本。
# 実装（dispatch / reviewer）はこの値を読む。値をコードに散らさない。
# 自動マージはしない。merge は人間（またはオーナーが明示したとき）だけ。

version = 1

[merge]
# reviewer は merge しない。人間が merge する。
mode = "manual"

[review]
# CI の必須チェック。Gate を required にした後で有効になる。
require_ci = "Gate"
# reviewer の所見。approve 以外は人間に渡す。
require_verdict = "approve"
# PR の author がこの一覧にいるときだけ通常 PR として扱う。
# worker App の bot login は App 作成後に確定する。
allow_authors = ["lapis-worker[bot]", "yukiidayo"]
deny_forks = true
max_files = 40
max_lines = 800

[limits]
# reviewer の差し戻し回数。超えたら ai-needs-human。
max_review_rounds = 3
# worker の連続失敗回数。
max_fix_attempts = 2
# ai-building のまま残ったジョブを回収するまでの分数。
stale_building_minutes = 60
# 1 ジョブ（worker / review）の上限。
job_timeout_minutes = 60

[protected_paths]
# ここを 1 つでも触った PR は、人間が承認するまで merge しない。
# CODEOWNERS の保護範囲に合わせる。
paths = [
  ".github/",
  "automation/",
  "reviewer/",
  "lints/",
  "scripts/ci/",
  "scripts/check*.py",
  "scripts/architecture-exceptions.json",
  "AGENTS.md",
  "Cargo.toml",
  "Cargo.lock",
  "protocol/",
  "release/",
  "clippy.toml",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "docs/specs/automation.md",
  ".opencode/skills/build-issue/",
  ".opencode/skills/review-pr/",
]
