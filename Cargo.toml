[workspace]
members = [
    "apps/desktop/*",
    "backend/runtime",
    "backend/host",
    "backend/infrastructure/*",
    "backend/transport/*",
    "shared/models/*",
    "shared/protocol",
]
exclude = ["vendor/gpui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A lightweight development workspace for Desktop and Mobile."
license = "MIT"

# Keep debug symbols and assertions for the dev run configuration while
# avoiding the frame-time cost of a completely unoptimized GPUI application.
[profile.dev]
opt-level = 1

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
gpui = { version = "0.2.2", path = "vendor/gpui" }
rfd = "0.15"
ropey = "1.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = "0.23"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
portable-pty = "0.9"
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb" }
wezterm-surface = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb" }
rcgen = "0.14"
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
